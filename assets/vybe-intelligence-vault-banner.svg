<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background Grid -->
  <g stroke="url(#grid-grad)" stroke-width="1">
    <!-- Horizontal lines -->
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Minimal Node Network -->
  <g stroke="#30363d" stroke-width="1.5" opacity="0.6">
    <line x1="100" y1="100" x2="200" y2="150" />
    <line x1="200" y1="150" x2="300" y2="100" />
    <line x1="300" y1="100" x2="300" y2="250" />
    <line x1="200" y1="150" x2="200" y2="300" />
    <line x1="900" y1="150" x2="1000" y2="100" />
    <line x1="1000" y1="100" x2="1100" y2="150" />
    <line x1="1000" y1="100" x2="1000" y2="250" />
    <line x1="900" y1="300" x2="1000" y2="250" />
  </g>

  <g fill="#8b949e" opacity="0.8">
    <circle cx="100" cy="100" r="4" fill="#58a6ff" />
    <circle cx="200" cy="150" r="5" />
    <circle cx="300" cy="100" r="4" />
    <circle cx="300" cy="250" r="5" fill="#bc8cff" />
    <circle cx="200" cy="300" r="4" />
    
    <circle cx="900" cy="150" r="4" />
    <circle cx="1000" cy="100" r="5" fill="#58a6ff" />
    <circle cx="1100" cy="150" r="4" />
    <circle cx="1000" cy="250" r="4" />
    <circle cx="900" cy="300" r="5" fill="#bc8cff" />
  </g>

  <!-- Decorative Accent Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#glow-grad)" />

  <!-- Center Typography -->
  <g text-anchor="middle">
    <!-- Title -->
    <text x="600" y="190" fill="#f0f6fc" font-size="52" font-weight="800" letter-spacing="3" opacity="0.95">VYBE INTELLIGENCE VAULT</text>
    
    <!-- Subtitle -->
    <text x="600" y="240" fill="#8b949e" font-size="20" font-weight="400" letter-spacing="1.5">Auto-Updating AI + Web Intelligence Archive</text>
    
    <!-- Minor Status Info -->
    <text x="600" y="275" fill="#30363d" font-size="12" font-weight="600" letter-spacing="4">SECURED • SCANNED • REFRESHED EVERY 3 HOURS</text>
  </g>
</svg>
