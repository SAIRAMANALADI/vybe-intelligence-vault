<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#059669" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background Grid -->
  <g stroke="url(#grid-fade)" stroke-width="1">
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    
    <!-- Vertical Grid Lines -->
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
  </g>

  <!-- Node connections (Left side) -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.7">
    <line x1="100" y1="120" x2="200" y2="200" />
    <line x1="200" y1="200" x2="300" y2="120" />
    <line x1="300" y1="120" x2="300" y2="280" />
    <line x1="200" y1="200" x2="200" y2="320" />
    <line x1="100" y1="280" x2="200" y2="200" />
  </g>

  <!-- Node points (Left side) -->
  <g opacity="0.8">
    <circle cx="100" cy="120" r="4" fill="#3b82f6" />
    <circle cx="200" cy="200" r="6" fill="#64748b" />
    <circle cx="300" cy="120" r="4" fill="#64748b" />
    <circle cx="300" cy="280" r="5" fill="#8b5cf6" />
    <circle cx="200" cy="320" r="4" fill="#64748b" />
    <circle cx="100" cy="280" r="4" fill="#64748b" />
  </g>

  <!-- Node connections (Right side) -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.7">
    <line x1="1100" y1="120" x2="1000" y2="200" />
    <line x1="1000" y1="200" x2="900" y2="120" />
    <line x1="900" y1="120" x2="900" y2="280" />
    <line x1="1000" y1="200" x2="1000" y2="320" />
    <line x1="1100" y1="280" x2="1000" y2="200" />
  </g>

  <!-- Node points (Right side) -->
  <g opacity="0.8">
    <circle cx="1100" cy="120" r="4" fill="#3b82f6" />
    <circle cx="1000" cy="200" r="6" fill="#64748b" />
    <circle cx="900" cy="120" r="4" fill="#64748b" />
    <circle cx="900" cy="280" r="5" fill="#8b5cf6" />
    <circle cx="1000" cy="320" r="4" fill="#64748b" />
    <circle cx="1100" cy="280" r="4" fill="#64748b" />
  </g>

  <!-- Top Accent Glow Line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#glow-line)" />

  <!-- Center Typography -->
  <g text-anchor="middle">
    <!-- Title -->
    <text x="600" y="160" fill="#f8fafc" font-size="52" font-weight="800" letter-spacing="4" opacity="0.95">Vybe Intelligence Vault</text>
    
    <!-- Subtitle -->
    <text x="600" y="210" fill="#94a3b8" font-size="20" font-weight="400" letter-spacing="1">Auto-updating AI + Web Intelligence for Builders</text>
    
    <!-- Spaced Labels list -->
    <text x="600" y="265" fill="#475569" font-size="12" font-weight="700" letter-spacing="3">AI AGENTS   •   RAG   •   MCP   •   PROMPTS   •   TOOLS   •   TEMPLATES   •   WEB DEV</text>
  </g>
</svg>
