name: LLM Vault Harvester v2.0

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      topic_filter:
        description: "Topics to search (comma-separated)"
        required: false
        default: "ai-agent,mcp-server,rag-stack"
        type: string
      max_repos:
        description: "Maximum repositories to discover (max 10)"
        required: false
        default: "10"
        type: string
      force_cloud_llm:
        description: "Force Cloud LLM (Mistral) instead of Local Ollama"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  discover:
    name: Stage 1 - Discover
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.run-discover.outputs.repos }}
      has_repos: ${{ steps.run-discover.outputs.has_repos }}
      correlation_id: ${{ steps.gen-id.outputs.corr_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Generate Correlation ID
        id: gen-id
        run: |
          echo "corr_id=corr_$(date +%s)" >> $GITHUB_OUTPUT

      - name: Run Discovery
        id: run-discover
        env:
          GITHUB_TOKEN: ${{ secrets.VAULT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Use topics from config or input filter
          TOPICS="${{ github.event.inputs.topic_filter || 'ai-agent,mcp-server,rag-stack' }}"
          MAX_REPOS="${{ github.event.inputs.max_repos || 10 }}"
          python scripts/evaluate_repo.py --mode discover \
            --topics "$TOPICS" \
            --max-repos $MAX_REPOS \
            --correlation-id "${{ steps.gen-id.outputs.corr_id }}"

      - name: Upload Discovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: discovery-batch
          path: discovery-batch.json

  evaluate:
    name: Stage 2 - Evaluate
    needs: discover
    if: needs.discover.outputs.has_repos == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJSON(needs.discover.outputs.repos) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install jsonschema

      - name: Run LLM Evaluation
        env:
          GITHUB_TOKEN: ${{ secrets.VAULT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          LLM_PROVIDER: "mistral"
        run: |
          FORCE_CLOUD="${{ github.event.inputs.force_cloud_llm != 'false' }}"
          CLOUD_ARG=""
          if [ "$FORCE_CLOUD" = "true" ]; then
            CLOUD_ARG="--force-cloud-llm"
          fi
          
          python scripts/evaluate_repo.py --mode evaluate \
            --repo "${{ matrix.repo }}" \
            $CLOUD_ARG \
            --correlation-id "${{ needs.discover.outputs.correlation_id }}"

      - name: Generate Safe Artifact Name
        id: safe-name
        run: |
          SAFE_NAME=$(echo "${{ matrix.repo }}" | tr '/' '-')
          echo "artifact_name=eval-$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Upload Evaluation JSON
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.safe-name.outputs.artifact_name }}
          path: evaluation-*.json
          if-no-files-found: ignore

  commit:
    name: Stage 3 - Commit
    needs: [discover, evaluate]
    if: always() && needs.discover.outputs.has_repos == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.VAULT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout Intelligence Engine
        uses: actions/checkout@v4
        with:
          repository: sairaman436/vybe-intelligence-engine
          path: engine
          token: ${{ secrets.VAULT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Engine Dependencies
        run: pip install -r engine/requirements.txt

      - name: Download all Evaluation Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: eval-*
          merge-multiple: true

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Digest Markdown
        env:
          GITHUB_TOKEN: ${{ secrets.VAULT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/evaluate_repo.py --mode generate \
            --correlation-id "${{ needs.discover.outputs.correlation_id }}"

      - name: Update Vault Stats & README
        run: |
          export PYTHONPATH=$(pwd)/engine/src
          python -c "
          from stats.vault_stats_builder import VaultStatsBuilder
          from pathlib import Path
          builder = VaultStatsBuilder(Path('.'))
          stats = builder.calculate_stats()
          builder.write_stats_files(stats)
          "

      - name: Commit & Push to Main
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add daily-digests/ vault-core/ README.md stats/ status/ trends/ reports/ change-log/
            git commit -m "docs(harvester): commit harvested digests and update vault stats [skip ci]"
            git push origin main
          else
            echo "No changes harvested."
          fi

  rebuild:
    name: Stage 4 - Rebuild
    needs: [discover, commit]
    if: always() && needs.discover.outputs.has_repos == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.VAULT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Wait for Rebuild Index Workflow Completion
        env:
          GITHUB_TOKEN: ${{ secrets.VAULT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting 25 seconds for push workflow to register..."
          sleep 25
          
          # Poll the GitHub API to wait for the latest Rebuild Vault Index run
          for i in {1..30}; do
            RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rebuild-index.yml/runs?branch=main")
            STATUS=$(echo "$RUNS" | grep -m 1 '"status":' | sed -E 's/.*"status": "([^"]*)".*/\1/')
            CONCLUSION=$(echo "$RUNS" | grep -m 1 '"conclusion":' | sed -E 's/.*"conclusion": "([^"]*)".*/\1/')
            
            echo "Rebuild Index status: $STATUS, conclusion: $CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              break
            fi
            sleep 15
          done

      - name: Pull Rebuilt Assets
        run: |
          git pull origin main

      - name: Verify Index Upgrade and Generate Pipeline Report
        run: |
          # Verify nodes and update system_health metrics
          # Compile pipeline report JSON
          echo "Compiling pipeline-report.json..."
          cat <<EOF > pipeline-report.json
          {
            "repos_found": $(jq 'length' discovery-batch.json 2>/dev/null || echo 0),
            "repos_evaluated": $(jq '.repos_evaluated | length' harvester-report.json 2>/dev/null || echo 0),
            "avg_quality": $(jq '.avg_quality_score' harvester-report.json 2>/dev/null || echo 0.0),
            "total_cost": $(jq '.total_cost' harvester-report.json 2>/dev/null || echo 0.0),
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          
          # Append event
          node -e "
            const fs = require('fs');
            const state = require('./scripts/state-manager');
            const report = JSON.parse(fs.readFileSync('pipeline-report.json', 'utf8'));
            state.appendEvent('pipeline.completed', report, '${{ needs.discover.outputs.correlation_id }}');
          "

      - name: Commit Observability Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vault-core/
          git commit -m "chore(observability): log pipeline event [skip ci]" || echo "No logs to commit"
          git push origin main || echo "No push required"

      - name: Upload Pipeline Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: pipeline-report.json
