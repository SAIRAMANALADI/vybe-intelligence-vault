name: LLM Vault Harvester v2.0

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      topic_filter:
        description: "Topics to search (comma-separated)"
        required: false
        default: "ai-agent,mcp-server,rag-stack"
        type: string
      max_repos:
        description: "Maximum repositories to discover"
        required: false
        default: "50"
        type: string
      force_cloud_llm:
        description: "Force Cloud LLM (Mistral) instead of Local Ollama"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  harvest:
    name: Harvest, Evaluate & Commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.VAULT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout Intelligence Engine
        uses: actions/checkout@v4
        with:
          repository: sairaman436/vybe-intelligence-engine
          path: engine
          token: ${{ secrets.VAULT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Restore evaluation cache
        uses: actions/cache/restore@v4
        with:
          path: |
            evaluation-*.json
            discovery-batch.json
          key: harvester-eval-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            harvester-eval-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install jsonschema crawl4ai
          # crawl4ai needs Playwright browsers on first install
          python -m crawl4ai.install_browsers || playwright install chromium --with-deps || true
          if [ -f engine/requirements.txt ]; then pip install -r engine/requirements.txt; fi

      - name: Generate Correlation ID
        id: gen-id
        run: |
          echo "corr_id=corr_$(date +%s)" >> $GITHUB_OUTPUT

      - name: Run Discovery
        id: run-discover
        env:
          GITHUB_TOKEN: ${{ secrets.VAULT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TOPICS="${{ github.event.inputs.topic_filter || 'ai-agent,mcp-server,rag-stack' }}"
          MAX_REPOS="${{ github.event.inputs.max_repos || 50 }}"
          python scripts/evaluate_repo.py --mode discover \
            --topics "$TOPICS" \
            --max-repos $MAX_REPOS \
            --correlation-id "${{ steps.gen-id.outputs.corr_id }}"

      - name: Check if repos were discovered
        id: check-discovery
        run: |
          if [ -f discovery-batch.json ] && [ "$(jq 'length' discovery-batch.json 2>/dev/null)" -gt 0 ]; then
            echo "has_repos=true" >> $GITHUB_OUTPUT
            echo "Discovered repositories for evaluation."
          else
            echo "has_repos=false" >> $GITHUB_OUTPUT
            echo "No new repositories discovered."
          fi

      - name: Run Batch LLM Evaluation
        if: steps.check-discovery.outputs.has_repos == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.VAULT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          LLM_PROVIDER: "mistral"
        run: |
          FORCE_CLOUD="${{ github.event.inputs.force_cloud_llm != 'false' }}"
          CLOUD_ARG=""
          if [ "$FORCE_CLOUD" = "true" ]; then
            CLOUD_ARG="--force-cloud-llm"
          fi
          
          python scripts/evaluate_repo.py --mode evaluate \
            $CLOUD_ARG \
            --correlation-id "${{ steps.gen-id.outputs.corr_id }}"

      - name: Configure Git Identity
        if: steps.check-discovery.outputs.has_repos == 'true'
        run: |
          git config --global user.name "${{ secrets.COMMIT_AUTHOR_NAME || 'sairaman436' }}"
          git config --global user.email "${{ secrets.COMMIT_AUTHOR_EMAIL || '24bq1a05p6@vvit.net' }}"

      - name: Generate Digest Markdown
        if: steps.check-discovery.outputs.has_repos == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.VAULT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/evaluate_repo.py --mode generate \
            --correlation-id "${{ steps.gen-id.outputs.corr_id }}"

      - name: Update Vault Stats & README
        if: steps.check-discovery.outputs.has_repos == 'true'
        run: |
          export PYTHONPATH=$(pwd)/engine/src
          python -c "
          from stats.vault_stats_builder import VaultStatsBuilder
          from pathlib import Path
          builder = VaultStatsBuilder(Path('.'))
          stats = builder.calculate_stats()
          builder.write_stats_files(stats)
          "

      - name: Commit & Push to Main
        if: steps.check-discovery.outputs.has_repos == 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add daily-digests/ vault-core/ README.md stats/ status/ trends/ reports/ change-log/
            git commit -m "docs(harvester): commit harvested digests and update vault stats [skip ci]"
            git stash -u || true
            git pull --rebase origin main
            git stash pop || true
            git push origin main
          else
            echo "No changes harvested."
          fi

      - name: Wait for Rebuild Index Workflow Completion
        if: steps.check-discovery.outputs.has_repos == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.VAULT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting 25 seconds for push workflow to register..."
          sleep 25
          
          for i in {1..30}; do
            RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rebuild-index.yml/runs?branch=main")
            STATUS=$(echo "$RUNS" | grep -m 1 '"status":' | sed -E 's/.*"status": "([^"]*)".*/\1/')
            CONCLUSION=$(echo "$RUNS" | grep -m 1 '"conclusion":' | sed -E 's/.*"conclusion": "([^"]*)".*/\1/')
            
            echo "Rebuild Index status: $STATUS, conclusion: $CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              break
            fi
            sleep 15
          done

      - name: Pull Rebuilt Assets
        if: steps.check-discovery.outputs.has_repos == 'true'
        run: |
          git pull origin main

      - name: Verify Index Upgrade and Generate Pipeline Report
        if: steps.check-discovery.outputs.has_repos == 'true'
        run: |
          echo "Compiling pipeline-report.json..."
          cat <<EOF > pipeline-report.json
          {
            "repos_found": $(jq 'length' discovery-batch.json 2>/dev/null || echo 0),
            "repos_evaluated": $(jq '.repos_evaluated | length' harvester-report.json 2>/dev/null || echo 0),
            "avg_quality": $(jq '.avg_quality_score' harvester-report.json 2>/dev/null || echo 0.0),
            "total_cost": $(jq '.total_cost' harvester-report.json 2>/dev/null || echo 0.0),
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          
          node -e "
            const fs = require('fs');
            const state = require('./scripts/state-manager');
            const report = JSON.parse(fs.readFileSync('pipeline-report.json', 'utf8'));
            state.appendEvent('pipeline.completed', report, '${{ steps.gen-id.outputs.corr_id }}');
          "

      - name: Commit Observability Updates
        if: steps.check-discovery.outputs.has_repos == 'true'
        run: |
          git config --global user.name "${{ secrets.COMMIT_AUTHOR_NAME || 'sairaman436' }}"
          git config --global user.email "${{ secrets.COMMIT_AUTHOR_EMAIL || '24bq1a05p6@vvit.net' }}"
          git add vault-core/
          git commit -m "chore(observability): log pipeline event [skip ci]" || echo "No logs to commit"
          git stash -u || true
          git pull --rebase origin main
          git stash pop || true
          git push origin main || echo "No push required"

      - name: Upload Pipeline Report Artifact
        if: steps.check-discovery.outputs.has_repos == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: pipeline-report.json

      - name: Save evaluation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            evaluation-*.json
            discovery-batch.json
          key: harvester-eval-${{ github.run_id }}-${{ github.run_attempt }}

  # Explicitly trigger the rebuild after new digests are pushed.
  # This fires regardless of [skip ci] on the commit because it is a workflow_call,
  # not a push event — which is the root cause of why the index was never rebuilt.
  rebuild-index:
    name: Trigger Index Rebuild
    needs: harvest
    if: needs.harvest.result == 'success'
    uses: ./.github/workflows/rebuild-index.yml
    secrets: inherit
