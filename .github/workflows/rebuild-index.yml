name: Rebuild Vault Index

on:
  # Triggered explicitly by harvester.yml after new digests are committed
  # This bypasses the [skip ci] block that was preventing auto-rebuilds
  workflow_call:
  # Also fires on direct pushes to these paths (e.g. manual edits, PRs)
  push:
    branches:
      - main
    paths:
      - "maps/**"
      - "skills/**"
      - "daily-digests/**"
      - "prompts/**"
      - "scripts/build-index.js"
      - "scripts/state-manager.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    name: Rebuild Graph Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use VAULT_GITHUB_TOKEN to allow the resulting push to trigger
          # downstream workflows (GITHUB_TOKEN pushes are silently blocked)
          token: ${{ secrets.VAULT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull latest before building
        run: git pull --rebase origin main

      - name: Rebuild Vault Graph Index
        run: node scripts/build-index.js

      - name: Commit & Push Index
        run: |
          git config --global user.name "${{ secrets.COMMIT_AUTHOR_NAME || 'sairaman436' }}"
          git config --global user.email "${{ secrets.COMMIT_AUTHOR_EMAIL || '24bq1a05p6@vvit.net' }}"
          if [ -n "$(git status --porcelain)" ]; then
            git add vault-core/vault-index.json world/public/vault-index.json || true
            git commit -m "chore(index): auto-rebuild graph index [skip ci]"
            git push origin main
            echo "Index rebuilt and pushed."
          else
            echo "Index unchanged — no push needed."
          fi
