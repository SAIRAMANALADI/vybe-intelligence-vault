name: Rebuild Vault Index

on:
  push:
    branches:
      - main
    paths:
      - "maps/**"
      - "skills/**"
      - "daily-digests/**"
      - "prompts/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    name: Rebuild Graph Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild & Push Index
        run: |
          git config --global user.name "${{ secrets.COMMIT_AUTHOR_NAME || 'sairaman436' }}"
          git config --global user.email "${{ secrets.COMMIT_AUTHOR_EMAIL || '24bq1a05p6@vvit.net' }}"
          
          # Pull latest remote changes first to prevent conflicts
          git pull --rebase origin main
          
          # Build the index on top of the latest pulled state
          node scripts/build-index.js
          
          # Stage, commit and push changes if any
          if [ -n "$(git status --porcelain)" ]; then
            git add world/public/vault-index.json
            git commit -m "chore: auto-rebuild graph index [skip ci]"
            git push origin main
          else
            echo "Index unchanged."
          fi
